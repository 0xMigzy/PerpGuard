      <stop offset="55%" stop-color="#5B3FD6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="shieldEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#F3EEFF"/>
      <stop offset="45%" stop-color="#C4B2FF"/>
      <stop offset="100%" stop-color="#5EEAD4"/>
    </linearGradient>
    <linearGradient id="barFill" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"  stop-color="#7C3AED"/>
      <stop offset="70%" stop-color="#C4B2FF"/>
      <stop offset="100%" stop-color="#E9FEFF"/>
    </linearGradient>
    <radialGradient id="disc" cx="50%" cy="42%" r="60%">
